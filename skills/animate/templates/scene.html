<!doctype html>
<meta charset="utf-8">
<title>Scene</title>
<!--
  Procedural scene. window.render(t) sets every style from t (seconds) and nothing else:
  no clock, no requestAnimationFrame, no CSS transitions or animations, no unseeded randomness.
  render.mjs inlines the app stylesheet at the marker below.
-->
<!--css-->
<style>
  *, *::before, *::after { transition: none !important; animation: none !important; caret-color: transparent; }
  html, body { margin: 0; width: 1280px; height: 800px; overflow: hidden; }
  body { position: relative; background: var(--background, #fff); font-family: var(--font-sans, system-ui, sans-serif); }
  .abs { position: absolute; left: 0; top: 0; }
  #app, #fx { position: absolute; left: 0; top: 0; width: 1280px; height: 800px; }
  #app { transform-origin: 0 0; will-change: transform, filter; }
</style>
<body>
<div id="app"></div>
<div id="fx"></div>
<script>
window.SCENE = { width: 1280, height: 800, duration: 8, fps: 60 };

// ---- math ----
const clamp = (x) => Math.min(1, Math.max(0, x));
const seg = (t, a, b) => clamp((t - a) / (b - a));           // 0 before a, 1 after b
const lerp = (a, b, k) => a + (b - a) * k;
const outCubic = (k) => 1 - Math.pow(1 - k, 3);
const inOutCubic = (k) => (k < 0.5 ? 4 * k ** 3 : 1 - Math.pow(-2 * k + 2, 3) / 2);
const outBack = (k) => 1 + 2.2 * Math.pow(k - 1, 3) + 1.2 * Math.pow(k - 1, 2);
const bez = (a, c, b, k) => [(1 - k) ** 2 * a[0] + 2 * (1 - k) * k * c[0] + k * k * b[0], (1 - k) ** 2 * a[1] + 2 * (1 - k) * k * c[1] + k * k * b[1]];
// Seeded random: same numbers on every frame and every render.
const rng = (seed) => () => ((seed = (seed * 16807) % 2147483647) - 1) / 2147483646;
const $ = (id) => document.getElementById(id);

// ---- per-frame style helpers ----
const setOp = (e, o) => { e.style.opacity = o; e.style.visibility = o > 0.001 ? "visible" : "hidden"; };
const rise = (e, k, dy = 10) => { setOp(e, k); e.style.transform = `translateY(${(1 - k) * dy}px)`; };
const pos = (e, x, y, o = 1, s = 1) => { setOp(e, o); e.style.transform = `translate(${x}px, ${y}px) translate(-50%, -50%) scale(${s})`; };
const typeText = (e, text, k) => { e.textContent = text.slice(0, Math.round(text.length * k)); };

// ---- timeline, seconds. Every beat of the storyboard is one entry. ----
const TL = {
  intro: [0.2, 0.8],
  type: [0.9, 2.2],
  reveal: [2.4, 3.0],
  outro: [7.2, 7.9], // ends in the frame-0 state, so the loop is seamless
};

// ---- markup: copy the real app's markup and class names, do not restyle ----
$("app").innerHTML = `
  <main class="abs" style="width:1280px;height:800px">
    <h1 id="title" class="abs text-2xl font-semibold" style="left:80px;top:120px">Hello</h1>
    <p id="line" class="abs text-lg" style="left:80px;top:180px"></p>
  </main>`;

// ---- geometry measured once, after fonts load, with everything expanded ----
let geo = {};
function measure() {
  const r = $("title").getBoundingClientRect();
  geo.title = { x: r.left, y: r.top, w: r.width, h: r.height };
}

function render(t) {
  const out = inOutCubic(seg(t, ...TL.outro));
  rise($("title"), outCubic(seg(t, ...TL.intro)) * (1 - out), 12);
  typeText($("line"), "Every frame is a function of time.", seg(t, ...TL.type));
  setOp($("line"), 1 - out);
}

window.render = render;
window.ready = document.fonts.ready.then(() => { measure(); render(0); });
</script>
